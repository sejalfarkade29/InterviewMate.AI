# Development database. Run:  docker compose up -d db
services:
  db:
    image: postgres:16
    container_name: interviewmate-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interviewmate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interviewmate"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
